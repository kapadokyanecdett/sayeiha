<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap | SAYE</title>
  <meta name="description" content="SAYE üye girişi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 2 20l10-4 10 4z' fill='%232f7bff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body data-page="giris">
  <div id="site-header"></div>

  <main>
    <header class="page-header">
      <div class="container">
        <div class="eyebrow">Hesap</div>
        <h1>Giriş Yap</h1>
      </div>
    </header>

    <section class="section-sm">
      <div class="container">
        <div class="auth-wrap">
          <div class="card auth-card">
            <div class="auth-alert-box alert hidden" style="margin-bottom:16px"></div>
            <form id="login-form" class="form-grid" novalidate>
              <div class="field full">
                <label for="l-username">Kullanıcı Adı <span class="req">*</span></label>
                <input id="l-username" name="username" type="text" required autocomplete="username" placeholder="kullanici_adi">
              </div>
              <div class="field full">
                <label for="l-password">Şifre <span class="req">*</span></label>
                <input id="l-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
              </div>
              <div class="field full">
                <button class="btn btn-primary" type="submit" style="width:100%">Giriş Yap</button>
                <span class="form-note">* ile işaretli alanlar zorunludur.</span>
              </div>
            </form>
            <p class="auth-alt">Şifreni mi unuttun? <a href="#" id="forgot-link">Şifre sıfırla</a></p>
            <p class="auth-alt">Hesabın yok mu? <a href="/kayit">Kayıt ol</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/site.js"></script>
</body>
</html>
