<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetim Paneli | SAYE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 2 20l10-4 10 4z' fill='%232f7bff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- GİRİŞ -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 20l10-4 10 4z"/><path d="M12 2v14"/></svg>
        </span>
        <span><b>SAYE</b><span>Yönetim Paneli</span></span>
      </div>
      <h2 style="font-size:1.3rem">Tekrar hoş geldiniz</h2>
      <p style="color:var(--text-muted);font-size:0.9rem">Site içeriğini yönetmek için giriş yapın.</p>
      <div id="login-error" class="alert alert-error hidden" style="margin-top:14px"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Kullanıcı Adı</label>
          <input id="username" name="username" type="text" autocomplete="username" required placeholder="admin">
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Giriş Yap</button>
      </form>
      <div class="login-hint">
        Varsayılan giriş: <b>admin</b> / <b>solar2026</b> — ilk girişten sonra Ayarlar bölümünden şifrenizi değiştirin.
      </div>
    </div>
  </div>

  <!-- UYGULAMA -->
  <div id="app-view" class="admin-app hidden">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h1 id="page-title">Genel Bakış</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="user-chip" id="user-chip"></div>
      </header>
      <div id="view-content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
